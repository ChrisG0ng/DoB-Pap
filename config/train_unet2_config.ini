; UNet2 training (reference only)
; python train_unet2.py --config config/train_unet2_config.ini

[MODEL]
dropout_keep_prob = 0.95

[DATA]
; Output of Synthetic_data_generation.py
train_data_dir = ./data/train/synthetic_50000
batch_size = 128
num_workers = 0
; Split by source patch so that augmented copies stay in one subset
validation_split = 0.2
random_seed = 42
; Scale concentrations by mean + 2*std per stain
use_concentration_scaling = true

[TRAINING]
num_epochs = 50
learning_rate = 1e-3
weight_decay = 1e-4
early_stopping_patience = 15
save_every = 50
reconstruction_weight = 1.0
concentration_weight = 1.0
; adam or adamw
optimizer = adamw
scheduler_patience = 5
scheduler_factor = 0.1
min_lr = 1e-8

[DEVICE]
device = cuda
; More than one id enables DataParallel
gpu_ids = 0,1,2,3

[PATHS]
model_save_dir = ./models/unet2_synthetic_50000
