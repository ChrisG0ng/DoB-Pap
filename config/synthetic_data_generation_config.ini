; Synthetic training data generation (reference only)
; python Synthetic_data_generation.py --config config/synthetic_data_generation_config.ini

[PATHS]
; Ground-truth concentration patches (256 x 256 x 4 .npy)
GT_dir = ./data/GT/concentration
; Stain vector CSV files (one per stain, N x 3, file name contains EY/H/LG/OG)
SM_dir = ./data/GT/stain_matrix
OD_output_dir = ./data/train/synthetic_50000
RGB_output_dir = ./data/train/synthetic_50000

[GENERATION]
Generation_number = 50000
random_seed = 42

[AUGMENTATION]
flip_probability = 0.5
rotate_probability = 0.5
; Scale factors: "b" -> log-uniform b^(2U-1); "lo, hi" -> uniform(lo, hi)
Scale_patch = 0.5, 2.5
Scale_EY = 0.5, 2.5
Scale_H = 0.5, 2.5
Scale_LG = 0.5, 2.5
Scale_OG = 0.5, 2.5
; Elastic deformation with alpha / sigma drawn from [min, max]
elastic_probability = 0.5
elastic_alpha = 10,50
elastic_sigma = 6,10
; Std of the Gaussian noise added to each stain vector before normalization
gaussian_noise_std = 0.025
; Minimum pairwise spectral angle (radians) between perturbed stain vectors
min_SAD = 0.25
; Std of the |Gaussian| background OD added before RGB conversion
back_gaussian_std = 0.015

[OUTPUT]
; Save RGB = 255 * 10^(-(OD + background))
Save_RGB = true
log_filename = generation_log.csv

[STAIN_MATRIX]
stain_order = EY,H,LG,OG
