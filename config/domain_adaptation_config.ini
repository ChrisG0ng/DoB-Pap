; UNet2 domain adaptation
; python Domain_adaptation.py --config config/domain_adaptation_config.ini

[DOMAIN_ADAPTATION]
; Target-domain RGB images (searched recursively)
input_dir = ./data/sample
; Source (pre-trained) model
model_path = ./models/unet2_synthetic_50000/unet2_stain_best.pth
; Outputs: patch_output/, od_output/, background/, stain_matrix/, finetuned_model/
output_base_dir = ./output/unet2/adaptation
device = cuda
gpu_id = 0

[INFERENCE]
batch_size = 64
image_extensions = .jpg,.jpeg,.tif,.tiff,.png,.bmp
; OD patches with a larger background fraction are not used in Steps 2 and 3
max_background_fraction = 0.8

[ESTIMATION]
; Fraction of most stain-dominant patches used per stain
top_percentage = 0.05
; Chi-square confidence of the Mahalanobis outlier rejection
confidence_level = 0.95

[FINETUNE]
num_epochs = 10
batch_size = 32
; adam or adamw
optimizer = adamw
learning_rate = 1e-3
weight_decay = 1e-4
dropout_keep_prob = 0.95
early_stopping_patience = 5
save_every = 10
scheduler_patience = 5
scheduler_factor = 0.1
min_lr = 1e-8
reconstruction_weight = 1.0
; Concentration scaler fitted on source-model predictions:
;   c99    - 99th percentile of values above 0.01
;   normal - mean + 2*std
compute_scaler_mode = c99
