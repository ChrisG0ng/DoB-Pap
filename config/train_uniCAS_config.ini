; UniCAS training (reference only)
; python train_uniCAS.py --config config/train_uniCAS_config.ini

[MODEL]
; 1-indexed UniCAS blocks fed to the decoder (exactly four)
block_indices = 6,12,18,24
proj_dim = 256
decoder_channels = 256
; group, batch or instance
decoder_norm = group
use_detail_branch = true
; Dropout in projection and decoder (the encoder is frozen)
dropout = 0.1

[DATA]
; Output of Synthetic_data_generation.py
train_data_dir = ./data/train/synthetic_50000
batch_size = 128
num_workers = 4
; Split by source patch so that augmented copies stay in one subset
validation_split = 0.2
random_seed = 42
; Scale concentrations by mean + 2*std per stain
use_concentration_scaling = true

[TRAINING]
num_epochs = 50
learning_rate = 1e-4
weight_decay = 1e-4
early_stopping_patience = 10
save_every = 50
reconstruction_weight = 1.0
concentration_weight = 1.0
; adam or adamw
optimizer = adamw
scheduler_patience = 5
scheduler_factor = 0.5
min_lr = 1e-8

[DEVICE]
device = cuda
; More than one id enables DataParallel
gpu_ids = 0,1,2,3

[PATHS]
model_save_dir = ./models/uniCAS_models_synthetic_50000
