; UniCAS domain adaptation
; python UniCAS_domain_adaptation.py --config config/uniCAS_domain_adaptation_config.ini

[DOMAIN_ADAPTATION]
; Target-domain RGB images (searched recursively; sub-folders are mirrored in the outputs)
input_dir = ./data/sample
; Source (pre-trained) model
model_path = ./models/uniCAS_models_synthetic_50000/uniCAS_stain_best.pth
; Outputs: patch_output/, od_output/, background/, scaler/, stain_matrix/, finetuned_model/
output_base_dir = ./output/uniCAS/adaptation
device = cuda
gpu_id = 0

[MODEL]
; Must match the checkpoint in model_path
block_indices = 6,12,18,24
proj_dim = 256
decoder_channels = 256
decoder_norm = group
use_detail_branch = true
dropout = 0.1

[INFERENCE]
batch_size = 32
image_extensions = .jpg,.jpeg,.tif,.tiff,.png,.bmp
; auto: most frequent RGB-sum peak
; Otsu: Otsu threshold on luminance shifted toward the bright-class mean
Background_method = Otsu
; Integer n: reflect-pad to multiples of n and split into n x n patches
; single:    fit each image into one 224 x 224 patch (for small cell crops)
patch_mode = 256
; OD patches with a larger background fraction are not used in Steps 2 and 3
max_background_fraction = 0.75
; Stop loading images once this many OD patches are kept (0 = all images)
max_od_patches = 500
; sequence (sorted) or random (seeded shuffle) image order
selection_mode = random
random_seed = 42

[ESTIMATION]
; Fraction of most stain-dominant patches used per stain
top_percentage = 0.05
; Chi-square confidence of the Mahalanobis outlier rejection
confidence_level = 0.95
; Max spectral angle (radians) to the reference Pap stain vectors
sad_outlier_threshold = 0.4

[FINETUNE]
num_epochs = 10
batch_size = 32
; adam or adamw
optimizer = adamw
learning_rate = 1e-6
weight_decay = 1e-4
early_stopping_patience = 5
save_every = 20
scheduler_patience = 5
scheduler_factor = 0.5
min_lr = 1e-8
reconstruction_weight = 1.0
; true: fit a new scaler on source-model predictions (compute_scaler_mode: c99 or normal)
; false: reuse the scaler stored in the source checkpoint
compute_scaler = false
compute_scaler_mode = c99

[SCALER]
; Lower cutoff before the 99th percentile (scaler/scaler.txt and c99 fine-tuning scaler)
fixed_c5 = 0.01
