; UniCAS inference (run UniCAS_domain_adaptation.py first)
; python UniCAS_inference.py --config config/uniCAS_inference_config.ini

[MODEL]
; Must match the checkpoint in model_path
block_indices = 6,12,18,24
proj_dim = 256
decoder_channels = 256
decoder_norm = group
use_detail_branch = true
dropout = 0.1

[DATA]
; An image file or a directory of images (searched recursively; sub-folders are mirrored)
test_data_dir = ./data/sample

[TESTING]
model_path = ./output/uniCAS/adaptation/finetuned_model/uniCAS_stain_best.pth
; auto or Otsu (see uniCAS_domain_adaptation_config.ini)
Background_method = Otsu
; Save reconstructed RGB images using the stain matrix below
Do_reconstruction = true
; overall_stain_matrix.txt from domain adaptation, or set
; fixed_stain_matrix = [[EY_R, H_R, LG_R, OG_R], [EY_G, ...], [EY_B, ...]]
fixed_stain_matrix_dir = ./output/uniCAS/adaptation/stain_matrix/overall_stain_matrix.txt
; Integer n (grid of n x n patches) or single (one 224 x 224 patch per image)
patch_mode = 256
; Crop the concentration map back to the input size (grid mode)
tile_to_initial = true
; sequence or random image order; inference_number limits the image count (0 = all)
selection_mode = sequence
random_seed = 42
inference_number = 0
batch_size = 64

[DEVICE]
device = cuda
gpu_id = 0

[PATHS]
; Outputs: concentration/, reconstruction/, background/, scaler/
output_dir = ./output/uniCAS/inference

[SCALER]
; Lower cutoff before the 99th percentile in scaler/scaler.txt
fixed_c5 = 0.01
