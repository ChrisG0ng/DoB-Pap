; UNet2 inference (run Domain_adaptation.py first)
; python inference.py --config config/inference_config.ini

[DATA]
; An image file or a directory of images (searched recursively)
test_data_dir = ./data/sample

[TESTING]
model_path = ./output/unet2/adaptation/finetuned_model/unet2_stain_best.pth
; Save reconstructed RGB images using the stain matrix below
Do_reconstruction = true
; overall_stain_matrix.txt from domain adaptation, or set
; fixed_stain_matrix = [[EY_R, H_R, LG_R, OG_R], [EY_G, ...], [EY_B, ...]]
fixed_stain_matrix_dir = ./output/unet2/adaptation/stain_matrix/overall_stain_matrix.txt
patch_size = 256
patch_stride = 256
batch_size = 64

[DEVICE]
device = cuda
gpu_id = 0

[PATHS]
; Outputs: concentration/, reconstruction/, background/, scaler/
output_dir = ./output/unet2/inference

[SCALER]
; Lower cutoff before the 99th percentile in scaler/scaler.txt
fixed_c5 = 0.01
